name: 주간 복기 초안 (주간)

# 금 12:00 UTC = 금 21:00 KST.
# 국고채 금리 적재(bond-spread-system daily.yml)가 11:00 UTC = 20:00 KST에 돈다. 그 뒤 1시간을 두고 받는다.
# 디렉터는 일요일에 주간전략을 쓴다 — 그때 복기가 이미 있어야 한다.
# **토요일에는 아무것도 돌리지 않는다**(디렉터 원칙).
on:
  schedule:
    - cron: "0 12 * * 5"
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run=초안만 출력(아무것도 안 씀) / run=복기 메모 기입"
        required: false
        default: "dry-run"
        type: choice
        options: ["dry-run", "run"]
      round:
        description: "회차 YYMMDD 지정(비우면 최신 회차)"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  # 등재 훅과 같은 DB(주간채권전략)를 만진다. 같은 그룹으로 묶어 **순차** 실행시킨다.
  group: weekly-strategy-db
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 4축 판정·멱등·안전장치 검증. 네트워크 불필요. **실데이터를 만지기 전에 돈다.**
      - name: 셀프테스트
        run: python3 scripts/strategy/weekly_review.py --selftest

      - name: 필수 시크릿 확인
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          BOND_SUPABASE_URL: ${{ secrets.BOND_SUPABASE_URL }}
          BOND_SUPABASE_KEY: ${{ secrets.BOND_SUPABASE_KEY }}
        run: |
          MISSING=0
          if [ -z "${NOTION_TOKEN}" ]; then
            echo "::error title=NOTION_TOKEN 미등록::gh secret set NOTION_TOKEN -R zzeonso1-ssonim/econ-cockpit"
            MISSING=1
          fi
          # 러너에는 bond-monitor 체크아웃이 없어 config.js 폴백이 통하지 않는다.
          # 로컬에서는 폴백이 먹지만 러너에서는 이 두 개가 반드시 있어야 한다.
          if [ -z "${BOND_SUPABASE_URL}" ] || [ -z "${BOND_SUPABASE_KEY}" ]; then
            echo "::error title=BOND_SUPABASE_URL/KEY 미등록::bond_spread_daily 조회용. bond-monitor/js/config.js의 SUPABASE_URL·SUPABASE_KEY(공개 publishable 키)와 같은 값을 Secrets에 등록해야 한다 (등록은 디렉터 몫)"
            MISSING=1
          fi
          exit $MISSING

      - name: 복기 초안 생성
        id: run
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          BOND_SUPABASE_URL: ${{ secrets.BOND_SUPABASE_URL }}
          BOND_SUPABASE_KEY: ${{ secrets.BOND_SUPABASE_KEY }}
        run: |
          MODE="${{ github.event.inputs.mode }}"
          MODE="${MODE:-run}"
          ARGS=""
          [ "$MODE" = "dry-run" ] && ARGS="--dry-run"
          if [ -n "${{ github.event.inputs.round }}" ]; then
            ARGS="$ARGS --round ${{ github.event.inputs.round }}"
          fi
          python3 scripts/strategy/weekly_review.py $ARGS --out "${RUNNER_TEMP}/review.json"

      - name: 결과 요약
        if: always()
        run: |
          OUT="${RUNNER_TEMP}/review.json"
          [ -f "$OUT" ] || exit 0
          python3 - "$OUT" <<'PY'
          import json, sys, os
          d = json.load(open(sys.argv[1]))
          a = d["axes"]
          trig = a["triggers"]
          lines = [
            "## 주간 복기 초안 — %s" % d["round"],
            "",
            "| 축 | 판정 |",
            "|---|---|",
            "| ① 방향 | %s |" % a["direction"]["verdict"],
            "| ② 레인지 | %s |" % a["range"]["verdict"],
            "| ③ 트리거 | 발동 %d · 미발동 %d · 확인 불가 %d |" % (
              sum(1 for x in trig if x["verdict"] == "발동"),
              sum(1 for x in trig if x["verdict"] == "미발동"),
              sum(1 for x in trig if x["verdict"] not in ("발동", "미발동"))),
            "| ④ 실행구간 | 도달 %d / %d |" % (
              sum(1 for x in a["levels"]["rows"] if x["verdict"] == "도달"),
              len(a["levels"]["rows"])),
            "",
            "동작: **%s** (기준일 %s)" % (d["action"], d["run_date"]),
            "",
            "> 원인 귀속은 사람이 채운다. 초안은 확정이 아니다.",
            "",
            "<details><summary>초안 전문</summary>",
            "",
            "```",
            d["draft"],
            "```",
            "",
            "</details>",
          ]
          open(os.environ["GITHUB_STEP_SUMMARY"], "a").write("\n".join(lines) + "\n")
          PY
